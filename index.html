<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghayat Autonomous Core</title>
    <style>
        body {
            margin: 0;
            background-color: #090a0f;
            color: #ffffff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .terminal-box {
            background: #121520;
            border: 2px solid #00ffcc;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 85%;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        h1 { color: #00ffcc; margin-top: 0; }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 255, 204, 0.1);
            border-right: 4px solid #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="terminal-box">
        <h1>النظام السيادي الآلي قيد التشغيل</h1>
        <p>تم توليد هذه الواجهة والملفات برمجياً من ملف وصف مشفر عبر بايثون.</p>
        <div class="status">الحالة: النظام يعمل بكفاءة تامة</div>
    </div>
</body>
</html>
