<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Ghayat: Cyber Battle Royale</title>
    <style>
        body { margin: 0; background: #020205; overflow: hidden; touch-action: none; }
        #hud { position: absolute; top: 15px; right: 15px; color: #00ffcc; font-family: monospace; z-index: 10; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; z-index: 10; box-sizing: border-box; }
        .btn { width: 70px; height: 70px; background: rgba(0, 255, 204, 0.2); border: 2px solid #00ffcc; border-radius: 50%; color: #fff; font-size: 20px; font-weight: bold; }
        #fire-btn { background: rgba(255, 0, 85, 0.3); border-color: #ff0055; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">
        <h2>غايات: باتل رويال</h2>
        <p id="score">النقاط: 0</p>
    </div>
    <div id="controls">
        <div>
            <button class="btn" onclick="move(-1, 0)">◀</button>
            <button class="btn" onclick="move(1, 0)">▶</button>
        </div>
        <div>
            <button class="btn" onclick="move(0, -1)">▲</button>
            <button class="btn" onclick="move(0, 1)">▼</button>
        </div>
        <button class="btn" id="fire-btn" onclick="shoot()">🔥</button>
    </div>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const grid = new THREE.GridHelper(40, 40, 0xff0055, 0x00ffcc);
        grid.position.y = -1;
        scene.add(grid);

        // اللاعب
        const player = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.2, 0.8),
            new THREE.MeshStandardMaterial({color: 0x00ffcc})
        );
        player.position.set(0, 0, 0);
        scene.add(player);

        // عدو سيبراني
        const enemy = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.2, 0.8),
            new THREE.MeshStandardMaterial({color: 0xff0055})
        );
        enemy.position.set(3, 0, -5);
        scene.add(enemy);

        // رصاصة اللاعب
        let bullet = null;
        let score = 0;

        function move(x, z) {
            player.position.x += x * 0.8;
            player.position.z += z * 0.8;
        }

        function shoot() {
            if (!bullet) {
                bullet = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2),
                    new THREE.MeshBasicMaterial({color: 0xffff00})
                );
                bullet.position.copy(player.position);
                scene.add(bullet);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // حركة الرصاصة
            if (bullet) {
                bullet.position.z -= 0.4;
                // اصطدام الرصاصة بالعدو
                if (bullet.position.distanceTo(enemy.position) < 1) {
                    score += 10;
                    document.getElementById('score').innerText = "النقاط: " + score;
                    enemy.position.x = (Math.random() - 0.5) * 6;
                    enemy.position.z = -5 - Math.random() * 5;
                    scene.remove(bullet);
                    bullet = null;
                } else if (bullet.position.z < -15) {
                    scene.remove(bullet);
                    bullet = null;
                }
            }

            // حركة العدو البسيطة نحو اللاعب
            enemy.position.z += 0.015;
            if(enemy.position.z > 2) enemy.position.z = -8;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
