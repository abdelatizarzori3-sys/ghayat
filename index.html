<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Ghayat: Config-Driven Cyber Battle</title>
    <style>
        body { margin: 0; background: #020205; overflow: hidden; touch-action: none; }
        #hud { position: absolute; top: 15px; right: 15px; color: #00ffcc; font-family: monospace; z-index: 10; font-size: 18px; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .btn { width: 70px; height: 70px; background: rgba(0, 255, 204, 0.2); border: 2px solid #00ffcc; border-radius: 50%; color: #fff; font-size: 20px; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">النقاط: <span id="score">0</span></div>
    <div id="controls">
        <button class="btn" onclick="movePlayer(-1)">◀</button>
        <button class="btn" onclick="movePlayer(1)">▶</button>
    </div>
    <script>
        // === روبوت الإعدادات الديناميكي (Game Config) ===
        const GAME_CONFIG = {
            enemySpeed: 0.04,
            spawnInterval: 1500, // بالمللي ثانية
            playerSpeed: 0.6,
            arenaGridSize: 30
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const grid = new THREE.GridHelper(GAME_CONFIG.arenaGridSize, 30, 0xff0055, 0x00ffcc);
        grid.position.y = -1;
        scene.add(grid);

        // اللاعب
        const player = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.2, 0.8),
            new THREE.MeshStandardMaterial({color: 0x00ffcc})
        );
        scene.add(player);

        let enemies = [];
        let score = 0;

        function movePlayer(dir) {
            player.position.x += dir * GAME_CONFIG.playerSpeed;
        }

        // نظام التوليد التلقائي بناءً على الإعدادات
        function spawnEnemy() {
            const enemy = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 1.2, 0.8),
                new THREE.MeshStandardMaterial({color: 0xff0055})
            );
            enemy.position.set((Math.random() - 0.5) * 10, 0, -12);
            scene.add(enemy);
            enemies.push(enemy);
        }
        setInterval(spawnEnemy, GAME_CONFIG.spawnInterval);

        function animate() {
            requestAnimationFrame(animate);

            // تحريك الأعداء تلقائياً حسب سرعة الإعدادات
            enemies.forEach((e, index) => {
                e.position.z += GAME_CONFIG.enemySpeed;
                
                // رصد الاصطدام البسيط مع اللاعب
                if(e.position.distanceTo(player.position) < 1) {
                    score += 5;
                    document.getElementById('score').innerText = score;
                    scene.remove(e);
                    enemies.splice(index, 1);
                } else if(e.position.z > 4) {
                    scene.remove(e);
                    enemies.splice(index, 1);
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
