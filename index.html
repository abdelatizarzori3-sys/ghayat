<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Ghayat: Cyber Hero Mode</title>
    <style>body { margin: 0; background: #000; overflow: hidden; } #hud { position: absolute; color: #0ff; font-family: monospace; top: 10px; left: 10px; }</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud"><h1>غايات: وضع البطل</h1><p>المس الشاشة لتعزيز طاقة البطل!</p></div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshNormalMaterial());
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: 0xff0055}));
        head.position.y = 1.2;
        group.add(body); group.add(head);
        scene.add(group);

        camera.position.z = 5;

        let speed = 0.02;
        window.addEventListener('touchstart', () => { speed = 0.1; });
        window.addEventListener('touchend', () => { speed = 0.02; });

        function animate() {
            requestAnimationFrame(animate);
            group.rotation.y += speed;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
