<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Ghayat: Cyber Battle</title>
    <style>
        body { margin: 0; background: #020205; overflow: hidden; touch-action: none; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; }
        .btn { width: 80px; height: 80px; background: rgba(0, 255, 204, 0.3); border: 2px solid #00ffcc; border-radius: 50%; color: #fff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="controls">
        <button class="btn" onclick="move('left')">◀</button>
        <button class="btn" onclick="move('up')">▲</button>
        <button class="btn" onclick="move('down')">▼</button>
        <button class="btn" onclick="move('right')">▶</button>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshStandardMaterial({color: 0x00ffcc}));
        group.add(body); scene.add(group);
        camera.position.z = 5;

        function move(dir) {
            if(dir == 'left') group.position.x -= 0.5;
            if(dir == 'right') group.position.x += 0.5;
            if(dir == 'up') group.position.z -= 0.5;
            if(dir == 'down') group.position.z += 0.5;
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
